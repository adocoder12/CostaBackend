services:
  # ── Go API ───────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: api-container
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=costaBackend
      - DB_SSLMODE=disable
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=eu-central-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET=costa-pms-uploads
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/ses-hospedajes-queue
      - ALLOWED_ORIGIN=http://localhost:3000
      - PORT=8080
      - GIN_MODE=debug
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - costa-network

  # ── nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx-container
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - costa-network

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres-container
    restart: unless-stopped
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=costaBackend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d costaBackend"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - costa-network

  # ── LocalStack (S3 + SQS) ────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-container
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=eu-central-1
    ports:
      - "4566:4566"
    volumes:
      # Change this from ./localstack to a named volume
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

 
# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  localstack_data:  # renamed from localstack to avoid conflict with bind mount

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  costa-network:
    driver: bridge